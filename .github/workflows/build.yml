name: Build and audit
on:
  push:
  pull_request:
permissions: {}
jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      SIDECAR_SIGNING_IDENTITY: '-'
    steps:
      - name: Fetch public source without third-party actions or credentials
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_SERVER_URL" == https://github.com ]]
          [[ "$GITHUB_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]
          [[ "$GITHUB_SHA" =~ ^[a-f0-9]{40}$ ]]
          git init .
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          git -c core.hooksPath=/dev/null fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git -c core.hooksPath=/dev/null checkout --detach FETCH_HEAD
      - name: Shell syntax and reviewed file list
        run: |
          for script in scripts/*.sh; do bash -n "$script"; done
          python3 scripts/source-archive.py --check
          python3 scripts/verify-public-tree.py
      - name: Lifecycle tests with ASan and UBSan (no devices)
        run: SANITIZERS=1 bash scripts/test.sh
      - name: Filesystem and packaging regression tests
        run: python3 Tests/release-tests.py
      - name: Clang static analysis
        run: bash scripts/analyze.sh
      - name: Compile and verify ad-hoc arm64 app
        run: bash scripts/build.sh
  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Fetch public source without third-party actions or credentials
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_SERVER_URL" == https://github.com ]]
          [[ "$GITHUB_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]
          [[ "$GITHUB_SHA" =~ ^[a-f0-9]{40}$ ]]
          git init .
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          git -c core.hooksPath=/dev/null fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git -c core.hooksPath=/dev/null checkout --detach FETCH_HEAD
          git -c core.hooksPath=/dev/null fetch origin 'refs/heads/*:refs/remotes/origin/*' 'refs/tags/*:refs/tags/*'
          if [[ "$(git rev-parse --is-shallow-repository)" == true ]]; then git -c core.hooksPath=/dev/null fetch --unshallow origin; fi
      - name: Install checksum-pinned Gitleaks and scan history and files
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl --fail --location --proto '=https' --tlsv1.2 --output gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz' | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          cd "$GITHUB_WORKSPACE"
          "$RUNNER_TEMP/gitleaks" git --log-opts=--all --redact=100 --ignore-gitleaks-allow .
          "$RUNNER_TEMP/gitleaks" dir --redact=100 --ignore-gitleaks-allow --max-archive-depth=4 .
  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [macos, secrets]
    runs-on: macos-15
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      SIDECAR_SIGNING_IDENTITY: '-'
    steps:
      - name: Fetch the tagged source without credentials
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_SERVER_URL" == https://github.com ]]
          [[ "$GITHUB_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]
          [[ "$GITHUB_SHA" =~ ^[a-f0-9]{40}$ ]]
          git init .
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          git -c core.hooksPath=/dev/null fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git -c core.hooksPath=/dev/null checkout --detach FETCH_HEAD
      - name: Build and verify release archives
        shell: bash
        run: |
          set -euo pipefail
          version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Info.plist)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$GITHUB_REF_NAME" == "v$version" ]]
          python3 scripts/verify-public-tree.py
          bash scripts/package.sh
          archives=(dist/preview.*/SideHustle-"$version"-arm64.zip)
          [[ ${#archives[@]} == 1 && -f "${archives[0]}" ]]
          release_dir="$(dirname "${archives[0]}")"
          (cd "$release_dir" && shasum -a 256 -c SHA256SUMS)
          unpacked="$(mktemp -d "$RUNNER_TEMP/sidehustle-package.XXXXXX")"
          ditto -x -k "${archives[0]}" "$unpacked"
          app="$unpacked/SideHustle.app"
          codesign --verify --strict --verbose=2 "$app"
          lipo "$app/Contents/MacOS/SideHustle" -verify_arch arm64
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")" == "$version" ]]
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$app/Contents/Info.plist")" == 13.0 ]]
          printf 'RELEASE_DIR=%s\n' "$release_dir" >> "$GITHUB_ENV"
      - name: Upload verified assets and publish experimental app release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          zip="SideHustle-$version-arm64.zip"
          source="SideHustle-$version-source.tar.gz"
          gh release create "$GITHUB_REF_NAME" \
            "$RELEASE_DIR/$zip" "$RELEASE_DIR/$source" "$RELEASE_DIR/SHA256SUMS" \
            --repo "$GITHUB_REPOSITORY" --verify-tag --draft --prerelease \
            --title "SideHustle $GITHUB_REF_NAME — experimental app preview" \
            --notes-file docs/RELEASE-NOTES.md
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --json assets > "$RUNNER_TEMP/sidehustle-assets.json"
          python3 - "$RUNNER_TEMP/sidehustle-assets.json" "$RELEASE_DIR" "$zip" "$source" <<'PY'
          import json, pathlib, sys
          metadata, directory, *names = sys.argv[1:]
          expected = {name: (pathlib.Path(directory) / name).stat().st_size for name in [*names, 'SHA256SUMS']}
          actual = {item['name']: item['size'] for item in json.loads(pathlib.Path(metadata).read_text())['assets']}
          if actual != expected:
              raise SystemExit('Release asset names or sizes differ from verified local files')
          print('PASS: all three release assets uploaded with expected sizes')
          PY
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
